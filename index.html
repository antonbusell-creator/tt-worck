    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem('app_theme') || 'dark');
      const [lang, setLang] = useState(() => localStorage.getItem('app_lang') || 'uk');
      const [activeTab, setActiveTab] = useState('works');
      const [showSettings, setShowSettings] = useState(false);
      const [showArchive, setShowArchive] = useState(false);
      
      const [clientId, setClientId] = useState(() => localStorage.getItem('app_google_client_id') || '');
      const [accessToken, setAccessToken] = useState(() => localStorage.getItem('app_google_token') || null);
      const [syncStatus, setSyncStatus] = useState('');

      const [works, setWorks] = useState(() => JSON.parse(localStorage.getItem('app_works_v4')) || []);
      const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('app_orders_v4')) || []);

      const [selectedWorkIds, setSelectedWorkIds] = useState([]);
      const [selectedOrderIds, setSelectedOrderIds] = useState([]);

      const [workModal, setWorkModal] = useState({ open: false, item: null });
      const [orderModal, setOrderModal] = useState({ open: false, item: null });
      const [statusModal, setStatusModal] = useState({ open: false, order: null });
      const [shareModal, setShareModal] = useState({ open: false, items: [], type: 'works' });

      const t = TRANSLATIONS[lang] || TRANSLATIONS.uk;

      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('app_theme', theme);
      }, [theme]);

      useEffect(() => {
        localStorage.setItem('app_works_v4', JSON.stringify(works));
      }, [works]);

      useEffect(() => {
        localStorage.setItem('app_orders_v4', JSON.stringify(orders));
      }, [orders]);

      useEffect(() => {
        localStorage.setItem('app_lang', lang);
      }, [lang]);

      useEffect(() => {
        localStorage.setItem('app_google_client_id', clientId);
      }, [clientId]);

      // Функція авторизації через Google Identity Services (GIS)
      const handleGoogleLogin = () => {
        if (!clientId.trim()) {
          alert('Будь ласка, спочатку вкажіть ваш Google OAuth Client ID у Налаштуваннях!');
          setShowSettings(true);
          return;
        }

        if (typeof google === 'undefined' || !google.accounts) {
          alert('Скрипт Google Identity Services ще не завантажився. Перевірте з\'єднання з інтернетом.');
          return;
        }

        const client = google.accounts.oauth2.initTokenClient({
          client_id: clientId.trim(),
          scope: 'https://www.googleapis.com/auth/drive.file',
          callback: (response) => {
            if (response.access_token) {
              setAccessToken(response.access_token);
              localStorage.setItem('app_google_token', response.access_token);
              setSyncStatus('Успішно авторизовано');
              syncToGoogleDrive(response.access_token);
            } else {
              setSyncStatus('Помилка авторизації');
            }
          },
        });
        client.requestAccessToken();
      };

      const handleGoogleLogout = () => {
        setAccessToken(null);
        localStorage.removeItem('app_google_token');
        setSyncStatus('');
      };

      // Синхронізація даних на Google Диск
      const syncToGoogleDrive = async (token = accessToken) => {
        if (!token) return;
        setSyncStatus('Синхронізація...');

        const backupData = {
          works,
          orders,
          updatedAt: new Date().toISOString()
        };

        try {
          // Шукаємо файл резервної копії на Диску
          const searchRes = await fetch("https://www.googleapis.com/drive/v3/files?q=name='construction_backup.json'+and+trashed=false", {
            headers: { Authorization: `Bearer ${token}` }
          });
          const searchData = await searchRes.json();
          const existingFile = searchData.files && searchData.files[0];

          const fileContent = JSON.stringify(backupData, null, 2);
          
          if (existingFile) {
            // Оновлюємо існуючий файл
            await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existingFile.id}?uploadType=media`, {
              method: 'PATCH',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json'
              },
              body: fileContent
            });
          } else {
            // Створюємо новий файл
            const metadata = {
              name: 'construction_backup.json',
              mimeType: 'application/json'
            };
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', new Blob([fileContent], { type: 'application/json' }));

            await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}` },
              body: form
            });
          }
          setSyncStatus(`Збережено о ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`);
        } catch (err) {
          console.error(err);
          setSyncStatus('Помилка збереження на Диск');
        }
      };

      const activeWorks = useMemo(() => works.filter(w => w.isArchived === showArchive), [works, showArchive]);
      const activeOrders = useMemo(() => orders.filter(o => o.isArchived === showArchive), [orders, showArchive]);

      useEffect(() => {
        setSelectedWorkIds([]);
        setSelectedOrderIds([]);
      }, [activeTab, showArchive]);

      const handleSaveWork = (formData) => {
        if (formData.id) {
          setWorks(works.map(w => w.id === formData.id ? { ...formData, updatedAt: new Date().toISOString() } : w));
        } else {
          const newWork = {
            ...formData,
            id: Date.now().toString(),
            isArchived: false,
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          };
          setWorks([newWork, ...works]);
        }
        setWorkModal({ open: false, item: null });
      };

      const handleDeleteWork = (id) => {
        if (confirm(t.confirmDelete)) {
          setWorks(works.filter(w => w.id !== id));
          setSelectedWorkIds(selectedWorkIds.filter(i => i !== id));
        }
      };

      const handleToggleArchiveWork = (id) => {
        setWorks(works.map(w => w.id === id ? { ...w, isArchived: !w.isArchived } : w));
      };

      const handleSelectAllWorks = (e) => {
        setSelectedWorkIds(e.target.checked ? activeWorks.map(w => w.id) : []);
      };

      const handleBulkArchiveWorks = () => {
        setWorks(works.map(w => selectedWorkIds.includes(w.id) ? { ...w, isArchived: !showArchive } : w));
        setSelectedWorkIds([]);
      };

      const handleBulkDeleteWorks = () => {
        if (confirm(t.confirmBulkDelete)) {
          setWorks(works.filter(w => !selectedWorkIds.includes(w.id)));
          setSelectedWorkIds([]);
        }
      };

      const handleSaveOrder = (formData) => {
        if (formData.id) {
          setOrders(orders.map(o => o.id === formData.id ? { ...formData, updatedAt: new Date().toISOString() } : o));
        } else {
          const newOrder = {
            ...formData,
            id: Date.now().toString(),
            isArchived: false,
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          };
          setOrders([newOrder, ...orders]);
        }
        setOrderModal({ open: false, item: null });
      };

      const handleDeleteOrder = (id) => {
        if (confirm(t.confirmDelete)) {
          setOrders(orders.filter(o => o.id !== id));
          setSelectedOrderIds(selectedOrderIds.filter(i => i !== id));
        }
      };

      const handleToggleArchiveOrder = (id) => {
        setOrders(orders.map(o => o.id === id ? { ...o, isArchived: !o.isArchived } : o));
      };

      const handleSaveOrderStatus = (orderId, updatedMaterials) => {
        setOrders(orders.map(o => {
          if (o.id === orderId) {
            const allReceived = updatedMaterials.length > 0 && updatedMaterials.every(m => m.received);
            const someReceived = updatedMaterials.some(m => m.received);
            let status = 'new';
            if (allReceived) status = 'completed';
            else if (someReceived) status = 'in_progress';

            return {
              ...o,
              materials: updatedMaterials,
              status,
              updatedAt: new Date().toISOString()
            };
          }
          return o;
        }));
        setStatusModal({ open: false, order: null });
      };

      const handleSelectAllOrders = (e) => {
        setSelectedOrderIds(e.target.checked ? activeOrders.map(o => o.id) : []);
      };

      const handleBulkArchiveOrders = () => {
        setOrders(orders.map(o => selectedOrderIds.includes(o.id) ? { ...o, isArchived: !showArchive } : o));
        setSelectedOrderIds([]);
      };

      const handleBulkDeleteOrders = () => {
        if (confirm(t.confirmBulkDelete)) {
          setOrders(orders.filter(o => !selectedOrderIds.includes(o.id)));
          setSelectedOrderIds([]);
        }
      };

      const handleExportExcel = (items, type) => {
        const dataToExport = [];

        if (type === 'works') {
          items.forEach(w => {
            if (w.materials && w.materials.length > 0) {
              w.materials.forEach(m => {
                dataToExport.push({
                  'Проект': w.projectName,
                  'Дата': w.date,
                  'Опис робіт': w.description,
                  'Час (год)': w.hoursSpent,
                  'Людей': w.peopleCount,
                  'Людино-години': w.totalManHours,
                  'Матеріал': m.description,
                  'Кількість': m.quantity,
                  'Од. вим.': m.unit
                });
              });
            } else {
              dataToExport.push({
                'Проект': w.projectName,
                'Дата': w.date,
                'Опис робіт': w.description,
                'Час (год)': w.hoursSpent,
                'Людей': w.peopleCount,
                'Людино-години': w.totalManHours,
                'Матеріал': '-',
                'Кількість': '-',
                'Од. вим.': '-'
              });
            }
          });
        } else {
          items.forEach(o => {
            const statusText = o.status === 'completed' ? 'Виконано' : o.status === 'in_progress' ? 'В процесі' : 'Нова';
            if (o.materials && o.materials.length > 0) {
              o.materials.forEach(m => {
                dataToExport.push({
                  'Проект': o.projectName,
                  'Дата': o.date,
                  'Терміново': o.isUrgent ? 'ТАК' : 'Ні',
                  'Статус': statusText,
                  'Матеріал': m.description,
                  'Кількість': m.quantity,
                  'Од. вим.': m.unit,
                  'Отримано': m.received ? 'ТАК' : 'Ні'
                });
              });
            } else {
              dataToExport.push({
                'Проект': o.projectName,
                'Дата': o.date,
                'Терміново': o.isUrgent ? 'ТАК' : 'Ні',
                'Статус': statusText,
                'Матеріал': '-',
                'Кількість': '-',
                'Од. вим.': '-',
                'Отримано': '-'
              });
            }
          });
        }

        const worksheet = XLSX.utils.json_to_sheet(dataToExport);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, type === 'works' ? "Додаткові роботи" : "Замовлення матеріалів");
        XLSX.writeFile(workbook, `${type === 'works' ? 'works' : 'orders'}_${new Date().toISOString().slice(0,10)}.xlsx`);
      };

      return (
        <div className="max-w-md mx-auto pb-20 min-h-screen flex flex-col">
          <header className="bg-white dark:bg-darkcard border-b border-gray-200 dark:border-darkborder sticky top-0 z-30 px-4 py-3 shadow-sm">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-lg bg-brand flex items-center justify-center text-white font-bold text-lg shadow-sm">
                  Б
                </div>
                <div>
                  <h1 className="font-bold text-base leading-tight">{t.appTitle}</h1>
                  {accessToken && (
                    <span className="text-[10px] text-green-500 font-medium flex items-center gap-1 cursor-pointer" onClick={() => syncToGoogleDrive()}>
                      ● {syncStatus || 'Google Drive Active'}
                    </span>
                  )}
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setShowArchive(!showArchive)}
                  className={`p-2 rounded-lg border text-xs font-medium flex items-center gap-1 transition-colors ${
                    showArchive 
                      ? 'bg-amber-500/10 border-amber-500 text-amber-500' 
                      : 'border-gray-200 dark:border-darkborder hover:bg-gray-100 dark:hover:bg-gray-800'
                  }`}
                  title={t.archive}
                >
                  <Icons.Archive />
                  {showArchive && <span className="text-[11px]">{t.archive}</span>}
                </button>

                <button 
                  onClick={() => setShowSettings(true)}
                  className="p-2 rounded-lg border border-gray-200 dark:border-darkborder hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
                  title={t.settings}
                >
                  <Icons.Settings />
                </button>
              </div>
            </div>

            <div className="flex bg-gray-100 dark:bg-darkbg p-1 rounded-xl mt-3">
              <button
                onClick={() => setActiveTab('works')}
                className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${
                  activeTab === 'works' 
                    ? 'bg-white dark:bg-darkcard text-brand shadow-sm' 
                    : 'text-gray-500 hover:text-gray-900 dark:hover:text-gray-200'
                }`}
              >
                {t.extraWorks}
              </button>
              <button
                onClick={() => setActiveTab('orders')}
                className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${
                  activeTab === 'orders' 
                    ? 'bg-white dark:bg-darkcard text-brand shadow-sm' 
                    : 'text-gray-500 hover:text-gray-900 dark:hover:text-gray-200'
                }`}
              >
                {t.materialOrders}
              </button>
            </div>
          </header>

          {showArchive && (
            <div className="bg-amber-500/10 border-b border-amber-500/20 px-4 py-2 text-xs text-amber-500 font-medium flex justify-between items-center">
              <span>Режим архіву заявок</span>
              <button onClick={() => setShowArchive(false)} className="underline font-bold">Вийти з архіву</button>
            </div>
          )}

          <main className="p-4 flex-1">
            {activeTab === 'works' ? (
              <div>
                {!showArchive && (
                  <button
                    onClick={() => setWorkModal({ open: true, item: null })}
                    className="w-full bg-brand hover:bg-brand-hover text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-brand/20 flex items-center justify-center gap-2 mb-4 transition-transform active:scale-[0.99]"
                  >
                    <Icons.PlusCircle />
                    <span>{t.addWork}</span>
                  </button>
                )}

                {activeWorks.length > 0 && (
                  <div className="flex items-center justify-between bg-white dark:bg-darkcard p-3 rounded-xl border border-gray-200 dark:border-darkborder mb-3 text-xs">
                    <label className="flex items-center gap-2 cursor-pointer font-medium">
                      <input 
                        type="checkbox" 
                        checked={selectedWorkIds.length === activeWorks.length && activeWorks.length > 0}
                        onChange={handleSelectAllWorks}
                        className="w-4 h-4 rounded text-brand focus:ring-brand accent-brand"
                      />
                      <span>{t.selectAll} ({selectedWorkIds.length})</span>
                    </label>

                    {selectedWorkIds.length > 0 && (
                      <div className="flex items-center gap-1">
                        <button 
                          onClick={() => setShareModal({ open: true, items: activeWorks.filter(w => selectedWorkIds.includes(w.id)), type: 'works' })}
                          className="p-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-800 text-brand"
                          title={t.share}
                        >
                          <Icons.Share />
                        </button>
                        <button 
                          onClick={() => handleExportExcel(activeWorks.filter(w => selectedWorkIds.includes(w.id)), 'works')}
                          className="p-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-800 text-green-600"
                          title={t.excel}
                        >
                          <Icons.Excel />
                        </button>
                        <button 
                          onClick={handleBulkArchiveWorks}
                          className="p-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-800 text-amber-500"
                          title={showArchive ? t.fromArchive : t.toArchive}
                        >
                          <Icons.Archive />
                        </button>
                        <button 
                          onClick={handleBulkDeleteWorks}
                          className="p-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-800 text-red-500"
                          title={t.delete}
                        >
                          <Icons.Trash />
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {activeWorks.length === 0 ? (
                  <div className="text-center py-12 text-gray-400 text-sm">
                    <p>{t.emptyList}</p>
                  </div>
                ) : (
                  <div className="space-y-2.5">
                    {activeWorks.map(work => (
                      <WorkCard 
                        key={work.id} 
                        work={work}
                        isSelected={selectedWorkIds.includes(work.id)}
                        onSelect={(id) => setSelectedWorkIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id])}
                        onEdit={() => setWorkModal({ open: true, item: work })}
                        onShare={() => setShareModal({ open: true, items: [work], type: 'works' })}
                        onArchive={() => handleToggleArchiveWork(work.id)}
                        onExcel={() => handleExportExcel([work], 'works')}
                        onDelete={() => handleDeleteWork(work.id)}
                        t={t}
                      />
                    ))}
                  </div>
                )}
              </div>
            ) : (
              <div>
                {!showArchive && (
                  <button
                    onClick={() => setOrderModal({ open: true, item: null })}
                    className="w-full bg-brand hover:bg-brand-hover text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-brand/20 flex items-center justify-center gap-2 mb-4 transition-transform active:scale-[0.99]"
                  >
                    <Icons.PlusCircle />
                    <span>{t.addOrder}</span>
                  </button>
                )}

                {activeOrders.length > 0 && (
                  <div className="flex items-center justify-between bg-white dark:bg-darkcard p-3 rounded-xl border border-gray-200 dark:border-darkborder mb-3 text-xs">
                    <label className="flex items-center gap-2 cursor-pointer font-medium">
                      <input 
                        type="checkbox" 
                        checked={selectedOrderIds.length === activeOrders.length && activeOrders.length > 0}
                        onChange={handleSelectAllOrders}
                        className="w-4 h-4 rounded text-brand focus:ring-brand accent-brand"
                      />
                      <span>{t.selectAll} ({selectedOrderIds.length})</span>
                    </label>

                    {selectedOrderIds.length > 0 && (
                      <div className="flex items-center gap-1">
                        <button 
                          onClick={() => setShareModal({ open: true, items: activeOrders.filter(o => selectedOrderIds.includes(o.id)), type: 'orders' })}
                          className="p-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-800 text-brand"
                          title={t.share}
                        >
                          <Icons.Share />
                        </button>
                        <button 
                          onClick={() => handleExportExcel(activeOrders.filter(o => selectedOrderIds.includes(o.id)), 'orders')}
                          className="p-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-800 text-green-600"
                          title={t.excel}
                        >
                          <Icons.Excel />
                        </button>
                        <button 
                          onClick={handleBulkArchiveOrders}
                          className="p-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-800 text-amber-500"
                          title={showArchive ? t.fromArchive : t.toArchive}
                        >
                          <Icons.Archive />
                        </button>
                        <button 
                          onClick={handleBulkDeleteOrders}
                          className="p-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-800 text-red-500"
                          title={t.delete}
                        >
                          <Icons.Trash />
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {activeOrders.length === 0 ? (
                  <div className="text-center py-12 text-gray-400 text-sm">
                    <p>{t.emptyList}</p>
                  </div>
                ) : (
                  <div className="space-y-2.5">
                    {activeOrders.map(order => (
                      <OrderCard 
                        key={order.id} 
                        order={order}
                        isSelected={selectedOrderIds.includes(order.id)}
                        onSelect={(id) => setSelectedOrderIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id])}
                        onStatus={() => setStatusModal({ open: true, order })}
                        onEdit={() => setOrderModal({ open: true, item: order })}
                        onShare={() => setShareModal({ open: true, items: [order], type: 'orders' })}
                        onArchive={() => handleToggleArchiveOrder(order.id)}
                        onExcel={() => handleExportExcel([order], 'orders')}
                        onDelete={() => handleDeleteOrder(order.id)}
                        t={t}
                      />
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>

          {showSettings && (
            <SettingsModal 
              clientId={clientId}
              setClientId={setClientId}
              accessToken={accessToken}
              syncStatus={syncStatus}
              theme={theme}
              setTheme={setTheme}
              lang={lang}
              setLang={setLang}
              onGoogleLogin={handleGoogleLogin}
              onGoogleLogout={handleGoogleLogout}
              onSyncNow={() => syncToGoogleDrive()}
              onClose={() => setShowSettings(false)}
              t={t}
            />
          )}

          {workModal.open && (
            <WorkFormModal 
              item={workModal.item}
              onSave={handleSaveWork}
              onClose={() => setWorkModal({ open: false, item: null })}
              t={t}
            />
          )}

          {orderModal.open && (
            <OrderFormModal 
              item={orderModal.item}
              onSave={handleSaveOrder}
              onClose={() => setOrderModal({ open: false, item: null })}
              t={t}
            />
          )}

          {statusModal.open && (
            <OrderStatusModal 
              order={statusModal.order}
              onSave={handleSaveOrderStatus}
              onClose={() => setStatusModal({ open: false, order: null })}
              t={t}
            />
          )}

          {shareModal.open && (
            <ShareModal 
              items={shareModal.items}
              type={shareModal.type}
              appLang={lang}
              onClose={() => setShareModal({ open: false, items: [], type: 'works' })}
              t={t}
            />
          )}
        </div>
      );
    }

    function WorkCard({ work, isSelected, onSelect, onEdit, onShare, onArchive, onExcel, onDelete, t }) {
      const [menuOpen, setMenuOpen] = useState(false);

      return (
        <div className={`bg-white dark:bg-darkcard rounded-xl p-3.5 border transition-all relative ${
          isSelected ? 'border-brand shadow-sm' : 'border-gray-200 dark:border-darkborder'
        }`}>
          <div className="flex items-start justify-between gap-2">
            <div className="flex items-start gap-2.5">
              <input 
                type="checkbox" 
                checked={isSelected}
                onChange={() => onSelect(work.id)}
                className="mt-1 w-4 h-4 rounded text-brand focus:ring-brand accent-brand cursor-pointer"
              />
              <div>
                <h3 className="font-bold text-sm leading-snug">{work.projectName}</h3>
                <p className="text-xs text-gray-500 mt-0.5">{work.date} • {work.totalManHours} людин.-год</p>
                <p className="text-xs text-gray-600 dark:text-gray-300 mt-1 line-clamp-2">{work.description}</p>
                {work.materials && work.materials.length > 0 && (
                  <div className="mt-2 text-[11px] text-gray-500 bg-gray-50 dark:bg-darkbg p-1.5 rounded-lg border border-gray-100 dark:border-darkborder">
                    <span className="font-semibold">{t.materialsUsed}:</span> {work.materials.map(m => `${m.description} (${m.quantity} ${m.unit})`).join(', ')}
                  </div>
                )}
              </div>
            </div>

            <div className="relative">
              <button 
                onClick={() => setMenuOpen(!menuOpen)}
                className="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500"
              >
                <Icons.Dots />
              </button>

              {menuOpen && (
                <>
                  <div className="fixed inset-0 z-10" onClick={() => setMenuOpen(false)}></div>
                  <div className="absolute right-0 top-7 z-20 w-40 bg-white dark:bg-darkcard rounded-xl shadow-xl border border-gray-200 dark:border-darkborder py-1 text-xs">
                    <button onClick={() => { setMenuOpen(false); onEdit(); }} className="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center gap-2">
                      <Icons.Edit /> {t.edit}
                    </button>
                    <button onClick={() => { setMenuOpen(false); onShare(); }} className="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center gap-2 text-brand">
                      <Icons.Share /> {t.share}
                    </button>
                    <button onClick={() => { setMenuOpen(false); onArchive(); }} className="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center gap-2 text-amber-500">
                      <Icons.Archive /> {work.isArchived ? t.fromArchive : t.toArchive}
                    </button>
                    <button onClick={() => { setMenuOpen(false); onExcel(); }} className="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center gap-2 text-green-600">
                      <Icons.Excel /> {t.excel}
                    </button>
                    <button onClick={() => { setMenuOpen(false); onDelete(); }} className="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center gap-2 text-red-500">
                      <Icons.Trash /> {t.delete}
                    </button>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    function OrderCard({ order, isSelected, onSelect, onStatus, onEdit, onShare, onArchive, onExcel, onDelete, t }) {
      const [menuOpen, setMenuOpen] = useState(false);

      let statusBg = 'border-gray-200 dark:border-darkborder';
      let badgeBg = 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-300';
      let statusText = t.newOrder;

      if (order.status === 'in_progress') {
        statusBg = 'border-amber-400 dark:border-amber-500/50 bg-amber-500/5';
        badgeBg = 'bg-amber-500/20 text-amber-600 dark:text-amber-400';
        statusText = t.inProgress;
      } else if (order.status === 'completed') {
        statusBg = 'border-green-500 dark:border-green-500/50 bg-green-500/5';
        badgeBg = 'bg-green-500/20 text-green-600 dark:text-green-400';
        statusText = t.completed;
      }

      return (
        <div className={`bg-white dark:bg-darkcard rounded-xl p-3.5 border transition-all relative ${statusBg} ${
          isSelected ? 'ring-2 ring-brand' : ''
        }`}>
          <div className="flex items-start justify-between gap-2">
            <div className="flex items-start gap-2.5">
              <input 
                type="checkbox" 
                checked={isSelected}
                onChange={() => onSelect(order.id)}
                className="mt-1 w-4 h-4 rounded text-brand focus:ring-brand accent-brand cursor-pointer"
              />
              <div>
                <div className="flex items-center gap-2 flex-wrap">
                  <h3 className="font-bold text-sm leading-snug">{order.projectName}</h3>
                  {order.isUrgent && (
                    <span className="px-1.5 py-0.5 bg-red-500 text-white font-bold text-[10px] rounded uppercase tracking-wider">
                      {t.urgent}
                    </span>
                  )}
                </div>
                
                <div className="flex items-center gap-2 mt-1">
                  <span className="text-xs text-gray-500">{order.date}</span>
                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${badgeBg}`}>
                    {statusText}
                  </span>
                </div>

                {order.materials && order.materials.length > 0 && (
                  <div className="mt-2 text-[11px] text-gray-500 bg-gray-50 dark:bg-darkbg p-1.5 rounded-lg border border-gray-100 dark:border-darkborder space-y-0.5">
                    {order.materials.map((m, idx) => (
                      <div key={idx} className="flex items-center justify-between">
                        <span className={m.received ? "line-through text-green-600 dark:text-green-400" : ""}>
                          • {m.description}
                        </span>
                        <span className="font-medium">{m.quantity} {m.unit}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

            <div className="relative">
              <button 
                onClick={() => setMenuOpen(!menuOpen)}
                className="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500"
              >
                <Icons.Dots />
              </button>

              {menuOpen && (
                <>
                  <div className="fixed inset-0 z-10" onClick={() => setMenuOpen(false)}></div>
                  <div className="absolute right-0 top-7 z-20 w-40 bg-white dark:bg-darkcard rounded-xl shadow-xl border border-gray-200 dark:border-darkborder py-1 text-xs">
                    <button onClick={() => { setMenuOpen(false); onStatus(); }} className="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center gap-2 font-bold text-brand">
                      <Icons.CheckSquare /> {t.status}
                    </button>
                    <button onClick={() => { setMenuOpen(false); onEdit(); }} className="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center gap-2">
                      <Icons.Edit /> {t.edit}
                    </button>
                    <button onClick={() => { setMenuOpen(false); onShare(); }} className="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center gap-2 text-brand">
                      <Icons.Share /> {t.share}
                    </button>
                    <button onClick={() => { setMenuOpen(false); onArchive(); }} className="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center gap-2 text-amber-500">
                      <Icons.Archive /> {order.isArchived ? t.fromArchive : t.toArchive}
                    </button>
                    <button onClick={() => { setMenuOpen(false); onExcel(); }} className="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center gap-2 text-green-600">
                      <Icons.Excel /> {t.excel}
                    </button>
                    <button onClick={() => { setMenuOpen(false); onDelete(); }} className="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center gap-2 text-red-500">
                      <Icons.Trash /> {t.delete}
                    </button>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    function WorkFormModal({ item, onSave, onClose, t }) {
      const [projectName, setProjectName] = useState(item?.projectName || '');
      const [description, setDescription] = useState(item?.description || '');
      const [date, setDate] = useState(item?.date || new Date().toISOString().slice(0,10));
      const [hoursSpent, setHoursSpent] = useState(item?.hoursSpent || 1);
      const [peopleCount, setPeopleCount] = useState(item?.peopleCount || 1);
      const [materials, setMaterials] = useState(item?.materials || [{ description: '', quantity: 1, unit: 'шт' }]);

      const totalManHours = useMemo(() => (Number(hoursSpent) || 0) * (Number(peopleCount) || 0), [hoursSpent, peopleCount]);

      const handleAddMaterial = () => {
        setMaterials([...materials, { description: '', quantity: 1, unit: 'шт' }]);
      };

      const handleRemoveMaterial = (index) => {
        setMaterials(materials.filter((_, i) => i !== index));
      };

      const handleMaterialChange = (index, field, value) => {
        setMaterials(materials.map((m, i) => i === index ? { ...m, [field]: value } : m));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          id: item?.id,
          projectName,
          description,
          date,
          hoursSpent: Number(hoursSpent),
          peopleCount: Number(peopleCount),
          totalManHours,
          materials: materials.filter(m => m.description.trim() !== '')
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-white dark:bg-darkcard w-full max-w-md max-h-[90vh] rounded-t-2xl sm:rounded-2xl flex flex-col overflow-hidden shadow-2xl border border-gray-200 dark:border-darkborder">
            <div className="p-4 border-b border-gray-200 dark:border-darkborder flex justify-between items-center">
              <h2 className="font-bold text-base">{item ? t.edit : t.addWork}</h2>
              <button onClick={onClose} className="p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800">
                <Icons.X />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-4 overflow-y-auto space-y-4 flex-1 text-xs">
              <div>
                <label className="block font-medium mb-1 text-gray-700 dark:text-gray-300">{t.projectName}</label>
                <input 
                  type="text" 
                  required
                  value={projectName} 
                  onChange={e => setProjectName(e.target.value)}
                  className="w-full p-2.5 rounded-lg border border-gray-300 dark:border-darkborder bg-transparent focus:ring-2 focus:ring-brand outline-none"
                  placeholder="напр. Об'єкт вул. Садова 15"
                />
              </div>

              <div>
                <label className="block font-medium mb-1 text-gray-700 dark:text-gray-300">{t.workDescription}</label>
                <textarea 
                  required
                  rows="3"
                  value={description} 
                  onChange={e => setDescription(e.target.value)}
                  className="w-full p-2.5 rounded-lg border border-gray-300 dark:border-darkborder bg-transparent focus:ring-2 focus:ring-brand outline-none"
                  placeholder="Опишіть виконані додаткові роботи..."
                />
              </div>

              <div>
                <div className="flex justify-between items-center mb-2">
                  <label className="font-medium text-gray-700 dark:text-gray-300">{t.materialsUsed}</label>
                  <button 
                    type="button" 
                    onClick={handleAddMaterial}
                    className="text-brand font-bold flex items-center gap-1 text-xs"
                  >
                    <Icons.Plus /> {t.addMaterial}
                  </button>
                </div>

                <div className="space-y-2">
                  {materials.map((mat, index) => (
                    <div key={index} className="flex gap-2 items-center">
                      <input 
                        type="text" 
                        placeholder={t.materialDesc}
                        value={mat.description}
                        onChange={e => handleMaterialChange(index, 'description', e.target.value)}
                        className="flex-1 p-2 rounded-lg border border-gray-300 dark:border-darkborder bg-transparent outline-none focus:ring-1 focus:ring-brand"
                      />
                      <input 
                        type="number" 
                        step="any"
                        placeholder={t.qty}
                        value={mat.quantity}
                        onChange={e => handleMaterialChange(index, 'quantity', e.target.value)}
                        className="w-16 p-2 rounded-lg border border-gray-300 dark:border-darkborder bg-transparent text-center outline-none focus:ring-1 focus:ring-brand"
                      />
                      <input 
                        type="text" 
                        placeholder={t.unit}
                        value={mat.unit}
                        onChange={e => handleMaterialChange(index, 'unit', e.target.value)}

    function ShareModal({ items, type, appLang, onClose, t }) {
      const [targetLang, setTargetLang] = useState('uk');
      const [editedText, setEditedText] = useState('');
      const [copied, setCopied] = useState(false);
      const [isTranslating, setIsTranslating] = useState(false);

      const generateBaseText = useCallback(() => {
        let lines = [];

        items.forEach((item, idx) => {
          if (type === 'works') {
            lines.push(`=== ЗВІТ ПРО ДОДАТКОВІ РОБОТИ ${items.length > 1 ? `#${idx + 1}` : ''} ===`);
            lines.push(`Проект: ${item.projectName}`);
            lines.push(`Дата: ${item.date}`);
            lines.push(`Опис робіт: ${item.description}`);
            lines.push(`Трудовитрати: ${item.hoursSpent} год x ${item.peopleCount} осіб = ${item.totalManHours} людино-годин`);
            
            lines.push(`Використані матеріали:`);
            if (item.materials && item.materials.length > 0) {
              item.materials.forEach(m => {
                lines.push(`- ${m.description}: ${m.quantity} ${m.unit}`);
              });
            } else {
              lines.push(`- Матеріали не вказані`);
            }
          } else {
            lines.push(`=== ЗВІТ ПРО ЗАМОВЛЕННЯ МАТЕРІАЛІВ ${items.length > 1 ? `#${idx + 1}` : ''} ===`);
            lines.push(`Проект: ${item.projectName} ${item.isUrgent ? '[ТЕРМІНОВО]' : ''}`);
            lines.push(`Дата: ${item.date}`);
            
            let statusText = 'НОВЕ ЗАМОВЛЕННЯ';
            if (item.status === 'completed') statusText = 'ВИКОНАНО';
            else if (item.status === 'in_progress') statusText = 'В ПРОЦЕСІ';
            
            lines.push(`Статус: ${statusText}`);

            const received = (item.materials || []).filter(m => m.received);
            const pending = (item.materials || []).filter(m => !m.received);

            if (item.status === 'in_progress' || item.status === 'completed') {
              if (received.length > 0) {
                lines.push(`Отримані позиції:`);
                received.forEach(m => lines.push(`  + ${m.description}: ${m.quantity} ${m.unit}`));
              }
              if (pending.length > 0) {
                lines.push(`Очікуються позиції:`);
                pending.forEach(m => lines.push(`  - ${m.description}: ${m.quantity} ${m.unit}`));
              }
            } else {
              lines.push(`Список матеріалів:`);
              (item.materials || []).forEach(m => {
                lines.push(`- ${m.description}: ${m.quantity} ${m.unit}`);
              });
            }
          }
          lines.push('');
        });

        return lines.join('\n').trim();
      }, [items, type]);

      const translateTextOnline = async (text, targetLangCode) => {
        if (targetLangCode === 'uk') return text;
        setIsTranslating(true);
        try {
          const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLangCode}&dt=t&q=${encodeURIComponent(text)}`);
          const data = await res.json();
          if (data && data[0]) {
            const translated = data[0].map(item => item[0]).join('');
            setIsTranslating(false);
            return translated;
          }
        } catch (error) {
          console.error('Помилка Google Translate API:', error);
        }
        setIsTranslating(false);
        return text;
      };

      useEffect(() => {
        const base = generateBaseText();
        if (targetLang === 'uk') {
          setEditedText(base);
        } else {
          translateTextOnline(base, targetLang).then(res => setEditedText(res));
        }
      }, [targetLang, generateBaseText]);

      const handleCopy = () => {
        navigator.clipboard.writeText(editedText);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const handleSMS = () => {
        window.location.href = `sms:?body=${encodeURIComponent(editedText)}`;
      };

      const handleEmail = () => {
        const subject = encodeURIComponent(`${type === 'works' ? 'Додаткові роботи' : 'Замовлення матеріалів'}`);
        window.location.href = `mailto:?subject=${subject}&body=${encodeURIComponent(editedText)}`;
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-white dark:bg-darkcard w-full max-w-md rounded-t-2xl sm:rounded-2xl flex flex-col overflow-hidden shadow-2xl border border-gray-200 dark:border-darkborder max-h-[90vh]">
            <div className="p-4 border-b border-gray-200 dark:border-darkborder flex justify-between items-center">
              <h2 className="font-bold text-base">{t.share}</h2>
              <button onClick={onClose} className="p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800">
                <Icons.X />
              </button>
            </div>

            <div className="p-4 space-y-3 text-xs overflow-y-auto flex-1">
              <div>
                <label className="block text-gray-500 font-medium mb-1.5">{t.translationTarget}:</label>
                <div className="flex bg-gray-100 dark:bg-darkbg p-1 rounded-xl">
                  <button 
                    onClick={() => setTargetLang('uk')}
                    className={`flex-1 py-1.5 rounded-lg font-bold transition-all ${
                      targetLang === 'uk' ? 'bg-white dark:bg-darkcard text-brand shadow-sm' : 'text-gray-500'
                    }`}
                  >
                    Українська
                  </button>
                  <button 
                    onClick={() => setTargetLang('en')}
                    className={`flex-1 py-1.5 rounded-lg font-bold transition-all ${
                      targetLang === 'en' ? 'bg-white dark:bg-darkcard text-brand shadow-sm' : 'text-gray-500'
                    }`}
                  >
                    English
                  </button>
                  <button 
                    onClick={() => setTargetLang('fr')}
                    className={`flex-1 py-1.5 rounded-lg font-bold transition-all ${
                      targetLang === 'fr' ? 'bg-white dark:bg-darkcard text-brand shadow-sm' : 'text-gray-500'
                    }`}
                  >
                    Français
                  </button>
                </div>
              </div>

              <div>
                <div className="flex justify-between items-center mb-1">
                  <label className="text-gray-500 font-medium">{t.previewTitle}:</label>
                  {isTranslating && (
                    <span className="text-[10px] text-brand font-bold animate-pulse">
                      {t.translating}
                    </span>
                  )}
                </div>
                <textarea 
                  rows="10"
                  disabled={isTranslating}
                  value={editedText}
                  onChange={(e) => setEditedText(e.target.value)}
                  className="w-full p-3 rounded-xl border border-gray-300 dark:border-darkborder bg-gray-50 dark:bg-darkbg font-mono text-[11px] leading-relaxed outline-none focus:ring-2 focus:ring-brand disabled:opacity-50"
                />
              </div>
            </div>

            <div className="p-4 border-t border-gray-200 dark:border-darkborder grid grid-cols-3 gap-2">
              <button 
                onClick={handleCopy}
                disabled={isTranslating}
                className="py-2.5 px-2 bg-brand hover:bg-brand-hover text-white font-bold rounded-xl flex items-center justify-center gap-1.5 text-xs shadow-md shadow-brand/20 col-span-3 sm:col-span-1 disabled:opacity-50"
              >
                <Icons.Copy />
                <span>{copied ? t.copied : t.copyText}</span>
              </button>

              <button 
                onClick={handleSMS}
                disabled={isTranslating}
                className="py-2.5 px-2 border border-gray-300 dark:border-darkborder font-bold rounded-xl flex items-center justify-center gap-1.5 text-xs hover:bg-gray-100 dark:hover:bg-gray-800 disabled:opacity-50"
              >
                <Icons.SMS />
                <span>{t.sendSMS}</span>
              </button>

              <button 
                onClick={handleEmail}
                disabled={isTranslating}
                className="py-2.5 px-2 border border-gray-300 dark:border-darkborder font-bold rounded-xl flex items-center justify-center gap-1.5 text-xs hover:bg-gray-100 dark:hover:bg-gray-800 disabled:opacity-50"
              >
                <Icons.Mail />
                <span>{t.sendEmail}</span>
              </button>
            </div>
          </div>
        </div>
      );
    }
